name: WBW
options:
  bundleIdPrefix: th.ac.mfu
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  WBW:
    type: application
    platform: iOS
    sources:
      - WBW
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        # **bundle ของ Club Fair ไม่ใช่ของ WBW** — record บน App Store ผูกกับ bundle id
        # ไม่ใช่กับโปรเจกต์ Xcode · build ที่มี id นี้จะถูก ASC รับเข้า record
        # `th.ac.mfu.su.clubfair` (Apple ID 6802118399) ซึ่งผ่านรีวิวไปแล้วที่ 1.0
        PRODUCT_BUNDLE_IDENTIFIER: th.ac.mfu.su.clubfair
        PRODUCT_NAME: WBW
        MARKETING_VERSION: "1.1"
        # **เริ่มที่ 7 ไม่ใช่ 14** — เลข build ต้องไม่ซ้ำกับที่เคยอัปขึ้น record นี้
        # Club Fair อัปไปแล้ว 6 build ส่วนเลข 13 เป็นของ record `th.ac.mfu.wbwSwift`
        # ซึ่งเป็นคนละรายการกันคนละเลข
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: NO
        # 1,2 = iPhone + iPad · เปิด iPad จริงเมื่อ 2026-08-25 (เดิมเป็น "1")
        # จอทุกใบต้องหนีบความกว้างด้วย `.contentColumn()` และเว้นก้นจอด้วย
        # `.tabBarClearance()` ไม่ใช่ค่าคงที่ของ iPhone — ดู `WBW/Layout.swift`
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NJL4K64JX5
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # แยกตาม config เพราะสองอย่างนี้ผิดกันคนละทางระหว่าง dev กับของที่ส่งขึ้น store:
        #   aps-environment — ถ้า build ที่ขึ้น store เป็น development แล้ว push จะไม่มา
        #                     สักอันโดยไม่มี error ให้เห็น
        #   Info.plist      — ตัว Debug มีคีย์วง LAN ไว้เทสบนเครื่องจริง ซึ่งห้ามหลุดขึ้น store
        Debug:
          INFOPLIST_FILE: WBW/Info-Debug.plist
          CODE_SIGN_ENTITLEMENTS: WBW/WBW-Debug.entitlements
        Release:
          INFOPLIST_FILE: WBW/Info.plist
          CODE_SIGN_ENTITLEMENTS: WBW/WBW-Release.entitlements
  WBWTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WBWTests
    dependencies:
      - target: WBW
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: th.ac.mfu.su.clubfairTests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_VERSION: "5.0"
schemes:
  WBW:
    build:
      targets:
        WBW: all
    test:
      targets:
        - WBWTests
    run:
      config: Debug
